openapi: 3.0.3
info:
  title: Weather Vector Search API
  version: 1.0.0
  description: >
    API for managing shared saved locations, synchronizing NWS narratives, and
    searching their embeddings. Local Docker Compose access is loopback-only. A
    Databricks Apps deployment is protected by workspace authentication and app
    permissions; anonymous/public access is not supported.
servers:
  - url: http://127.0.0.1:5000
    description: Trusted local development
paths:
  /weather/locations:
    get:
      summary: List shared saved locations
      description: Returns the persisted location list shared by authorized users of this application deployment.
      responses:
        "200":
          description: Current shared saved-location list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedLocationListResponse"
        "503":
          description: The database is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Add a shared saved location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSavedLocationRequest"
      responses:
        "201":
          description: Location saved and available to all authorized users of this deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedLocationResponse"
        "400":
          description: The location input is malformed or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The database is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /weather/locations/{location_id}:
    delete:
      summary: Remove a saved location and clean up its weather data
      description: >
        Removes the location's document associations. Documents with no remaining
        saved-location associations and their embeddings are deleted. Documents still
        associated with another saved location are retained. The operation is
        all-or-nothing.
      parameters:
        - name: location_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Location removed; unreferenced documents and chunks were deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteSavedLocationResponse"
        "400":
          description: The path location_id is not a valid UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The saved location does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The database operation failed and was rolled back.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /weather/sync:
    post:
      summary: Synchronize NWS documents for locations
      description: >
        Accepts references to saved locations. Syncs only alerts affecting each
        selected point and its daily/hourly gridpoint forecast narratives.
        A request can partially succeed by location. Each location has a budget of at
        most 20 outbound NWS request attempts, including retries; exhausting the budget
        stops further requests for that location and is reported as a partial outcome.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncRequest"
            example:
              locations:
                - id: 8a0d8c6b-36ea-4ff7-bdea-5e4d7b6f4701
                - id: ca915be1-63ea-42cc-97f0-cf350c6dd11a
              limit: 50
      responses:
        "200":
          description: Sync completed, possibly with per-location failures.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResponse"
        "400":
          description: Malformed request or invalid limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: All locations failed validation, lookup, or saved-location resolution; per-location errors are returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResponse"
        "502":
          description: All locations failed and at least one failed because of an NWS provider or request error; per-location errors are returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResponse"
        "503":
          description: Lakebase is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /weather/search:
    post:
      summary: Search weather narratives by meaning
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
            example:
              query: risk of flooding near rivers
              top_k: 5
      responses:
        "200":
          description: Search completed; matches may be empty if no current embeddings exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          description: Query is missing/malformed or top_k is not an integer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Lakebase or the query encoder is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    LocationInput:
      oneOf:
        - type: string
          minLength: 3
          description: U.S. city and two-letter state abbreviation, such as Chicago, IL.
        - type: object
          required: [lat, lon]
          additionalProperties: false
          properties:
            lat:
              type: number
              minimum: -90
              maximum: 90
            lon:
              type: number
              minimum: -180
              maximum: 180
    SavedLocationReference:
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
    CreateSavedLocationRequest:
      type: object
      required: [location]
      additionalProperties: false
      properties:
        location:
          $ref: "#/components/schemas/LocationInput"
    SavedLocation:
      type: object
      required: [id, input, display_location]
      properties:
        id:
          type: string
          format: uuid
        input:
          $ref: "#/components/schemas/LocationInput"
        display_location:
          type: string
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        grid_id:
          type: string
          nullable: true
        grid_x:
          type: integer
          nullable: true
        grid_y:
          type: integer
          nullable: true
    SavedLocationListResponse:
      type: object
      required: [locations]
      properties:
        locations:
          type: array
          items:
            $ref: "#/components/schemas/SavedLocation"
    SavedLocationResponse:
      type: object
      required: [location]
      properties:
        location:
          $ref: "#/components/schemas/SavedLocation"
    DeleteSavedLocationResponse:
      type: object
      required: [location_id, documents_deleted, chunks_deleted, shared_documents_retained]
      properties:
        location_id:
          type: string
          format: uuid
        documents_deleted:
          type: integer
          minimum: 0
        chunks_deleted:
          type: integer
          minimum: 0
        shared_documents_retained:
          type: integer
          minimum: 0
    SyncRequest:
      type: object
      required: [locations]
      additionalProperties: false
      properties:
        locations:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SavedLocationReference"
        limit:
          type: integer
          minimum: 1
          default: 50
          description: Maximum total weather documents synchronized by this request.
    LocationSyncResult:
      type: object
      required: [location_id, location, status, documents_synced, request_budget_exhausted]
      properties:
        location_id:
          type: string
          format: uuid
        location:
          type: string
          description: Saved location display label.
        status:
          type: string
          enum: [synced, partial, failed]
        documents_synced:
          type: integer
          minimum: 0
        request_budget_exhausted:
          type: boolean
          description: True when the location reached its 20-attempt budget before sync completed.
        error:
          type: string
          nullable: true
    SyncResponse:
      type: object
      required: [documents_synced, locations]
      properties:
        documents_synced:
          type: integer
          minimum: 0
        locations:
          type: array
          items:
            $ref: "#/components/schemas/LocationSyncResult"
    SearchRequest:
      type: object
      required: [query]
      additionalProperties: false
      properties:
        query:
          type: string
          minLength: 1
        top_k:
          type: integer
          default: 5
          description: Numeric values are clamped to 1–20.
    SearchMatch:
      type: object
      required:
        - document_id
        - source_type
        - locations
        - headline
        - chunk_text
        - similarity
        - synced_at
        - issued_at
        - effective_at
        - period_start
        - period_end
      properties:
        document_id:
          type: string
        source_type:
          type: string
          enum: [alert, forecast]
        locations:
          type: array
          description: All saved locations still associated with this source document.
          items:
            type: string
        headline:
          type: string
          nullable: true
        chunk_text:
          type: string
        similarity:
          type: number
          description: One minus pgvector cosine distance.
        synced_at:
          type: string
          format: date-time
        issued_at:
          type: string
          format: date-time
          nullable: true
        effective_at:
          type: string
          format: date-time
          nullable: true
        period_start:
          type: string
          format: date-time
          nullable: true
        period_end:
          type: string
          format: date-time
          nullable: true
    SearchResponse:
      type: object
      required: [matches]
      properties:
        matches:
          type: array
          items:
            $ref: "#/components/schemas/SearchMatch"
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
